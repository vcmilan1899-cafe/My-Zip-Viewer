<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zip Viewer Ultra - Zoom Fixed</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #eee; }
        body { background: var(--bg-color); color: var(--text-color); font-family: sans-serif; margin: 0; overflow: hidden; touch-action: none; }
        header { padding: 10px; background: #333; display: flex; align-items: center; gap: 10px; z-index: 10; }
        #thumbnail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; padding: 10px; height: calc(100vh - 60px); overflow-y: auto; touch-action: auto; }
        .thumb-container { cursor: pointer; background: #000; border-radius: 4px; overflow: hidden; text-align: center; height: 150px; }
        .thumb-container img { width: 100%; height: 130px; object-fit: contain; background: #222; }
        
        #preview-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; flex-direction: column; overflow: hidden; }
        
        /* 拡大・縮小・移動の対象エリア */
        #zoom-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; cursor: grab; }
        #image-area { display: flex; justify-content: center; align-items: center; transition: transform 0.1s ease-out; transform-origin: center; will-change: transform; }
        .viewer-img { max-height: 100vh; max-width: 100vw; object-fit: contain; pointer-events: none; }
        
        #controls-panel, #close-btn { transition: opacity 0.3s; z-index: 200; }
        .hide { opacity: 0 !important; visibility: hidden !important; }
        #close-btn { position: absolute; top: 10px; left: 10px; background: rgba(255,68,68,0.9); color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 5px; }
        #controls-panel { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.8); padding: 15px 0; display: flex; flex-direction: column; align-items: center; font-size: 12px; }
        #seekbar { width: 80%; margin-bottom: 10px; }
    </style>
</head>
<body>

<header>
    <input type="file" id="zip-input" accept=".zip">
    <span id="status">Zipを選択</span>
</header>

<div id="thumbnail-grid"></div>

<div id="preview-overlay">
    <button id="close-btn">一覧</button>
    <div id="zoom-container">
        <div id="image-area">
            <img id="img-left" class="viewer-img">
            <img id="img-right" class="viewer-img">
        </div>
    </div>
    <div id="controls-panel">
        <div style="margin-bottom:10px;">
            <select id="direction-set"><option value="rtl">右開き</option><option value="ltr">左開き</option></select>
            <select id="view-mode" style="margin-left:10px;"><option value="single">単ページ</option><option value="double">見開き</option></select>
        </div>
        <input type="range" id="seekbar" min="0" value="0" step="1">
        <div id="page-count"></div>
    </div>
</div>

<script>
    let zipEntries = [], blobCache = new Map(), currentIndex = 0, idleTimer;
    const state = { direction: 'rtl', viewMode: 'single' };

    // ズーム・移動用変数
    let scale = 1, posX = 0, posY = 0, startX = 0, startY = 0, isDragging = false;
    let initialPinchDistance = 0;

    const overlay = document.getElementById('preview-overlay');
    const imageArea = document.getElementById('image-area');
    const seekbar = document.getElementById('seekbar');

    // ZIP読み込み
    document.getElementById('zip-input').onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        document.getElementById('thumbnail-grid').innerHTML = "解析中...";
        const zip = await JSZip.loadAsync(file);
        zipEntries = [];
        zip.forEach((path, entry) => { if (/\.(jpe?g|png|gif|webp)$/i.test(path)) zipEntries.push(entry); });
        zipEntries.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true}));
        document.getElementById('status').textContent = `${zipEntries.length}枚`;
        seekbar.max = zipEntries.length - 1;
        renderThumbnails();
    };

    function renderThumbnails() {
        const grid = document.getElementById('thumbnail-grid');
        grid.innerHTML = "";
        zipEntries.forEach((entry, index) => {
            const div = document.createElement('div');
            div.className = 'thumb-container';
            div.innerHTML = `<div style="margin-top:60px; font-size:10px;">...</div>`;
            div.onclick = () => { currentIndex = index; overlay.style.display = 'flex'; updatePreview(); showUI(); };
            grid.appendChild(div);
            (async () => {
                const blob = await entry.async("blob");
                div.innerHTML = `<img src="${URL.createObjectURL(blob)}"><div style="font-size:10px">${index + 1}</div>`;
            })();
        });
    }

    async function getImageUrl(index) {
        if (index < 0 || index >= zipEntries.length) return null;
        if (blobCache.has(index)) return blobCache.get(index);
        const blob = await zipEntries[index].async("blob");
        const url = URL.createObjectURL(blob);
        blobCache.set(index, url);
        if (blobCache.size > 10) { const key = blobCache.keys().next().value; URL.revokeObjectURL(blobCache.get(key)); blobCache.delete(key); }
        return url;
    }

    async function updatePreview() {
        resetZoom();
        const isDouble = state.viewMode === 'double';
        const url1 = await getImageUrl(currentIndex);
        const imgL = document.getElementById('img-left');
        const imgR = document.getElementById('img-right');
        
        imgL.style.display = 'none'; imgR.style.display = 'none';
        if (!isDouble) {
            imgL.src = url1; imgL.style.display = 'block';
        } else {
            const url2 = await getImageUrl(currentIndex + 1);
            imgL.style.display = 'block'; imgR.style.display = url2 ? 'block' : 'none';
            if (state.direction === 'rtl') { imgR.src = url1; if(url2) imgL.src = url2; }
            else { imgL.src = url1; if(url2) imgR.src = url2; }
        }
        document.getElementById('page-count').textContent = `${currentIndex + 1} / ${zipEntries.length}`;
        seekbar.value = currentIndex;
    }

    function resetZoom() { scale = 1; posX = 0; posY = 0; applyTransform(); }
    function applyTransform() { imageArea.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`; }

    // --- インタラクション制御 ---
    overlay.addEventListener('wheel', (e) => {
        e.preventDefault();
        const delta = e.deltaY > 0 ? 0.9 : 1.1;
        scale = Math.min(Math.max(1, scale * delta), 5);
        if (scale === 1) { posX = 0; posY = 0; }
        applyTransform();
    }, { passive: false });

    overlay.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
            initialPinchDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
        } else {
            isDragging = true;
            startX = e.touches[0].pageX - posX;
            startY = e.touches[0].pageY - posY;
        }
        resetIdleTimer();
    });

    overlay.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2) {
            const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            scale = Math.min(Math.max(1, scale * (dist / initialPinchDistance)), 5);
            initialPinchDistance = dist;
        } else if (isDragging && scale > 1) {
            posX = e.touches[0].pageX - startX;
            posY = e.touches[0].pageY - startY;
        }
        applyTransform();
    });

    overlay.addEventListener('touchend', (e) => {
        if (isDragging && scale === 1) {
            const diffX = (e.changedTouches[0].pageX - startX);
            if (Math.abs(diffX) > 50) nextPrev(diffX > 0 ? -1 : 1);
            else if (Math.abs(diffX) < 10) handleCenterClick(e.changedTouches[0].pageX);
        }
        isDragging = false;
    });

    // PC用ドラッグ
    overlay.addEventListener('mousedown', (e) => {
        if (e.target.closest('#controls-panel') || e.target.closest('#close-btn')) return;
        isDragging = true;
        startX = e.pageX - posX;
        startY = e.pageY - posY;
    });
    window.addEventListener('mousemove', (e) => {
        if (isDragging && scale > 1) {
            posX = e.pageX - startX;
            posY = e.pageY - startY;
            applyTransform();
        }
    });
    window.addEventListener('mouseup', (e) => {
        if (isDragging && scale === 1) {
            const diffX = e.pageX - startX;
            if (Math.abs(diffX) < 5) handleCenterClick(e.pageX);
            else if (Math.abs(diffX) > 50) nextPrev(diffX > 0 ? -1 : 1);
        }
        isDragging = false;
    });

    function handleCenterClick(x) {
        const width = window.innerWidth;
        if (x < width * 0.2) nextPrev(-1);
        else if (x > width * 0.8) nextPrev(1);
        else document.getElementById('controls-panel').classList.contains('hide') ? showUI() : hideUI();
    }

    function nextPrev(n) {
        if (scale > 1) return;
        const step = (state.viewMode === 'double' ? 2 : 1) * n;
        currentIndex += (state.direction === 'rtl' ? -step : step);
        currentIndex = Math.max(0, Math.min(currentIndex, zipEntries.length - 1));
        updatePreview();
    }

    function showUI() { document.getElementById('controls-panel').classList.remove('hide'); document.getElementById('close-btn').classList.remove('hide'); resetIdleTimer(); }
    function hideUI() { document.getElementById('controls-panel').classList.add('hide'); document.getElementById('close-btn').classList.add('hide'); }
    function resetIdleTimer() { clearTimeout(idleTimer); if (overlay.style.display === 'flex') idleTimer = setTimeout(hideUI, 3000); }

    document.getElementById('direction-set').onchange = (e) => { state.direction = e.target.value; updatePreview(); };
    document.getElementById('view-mode').onchange = (e) => { state.viewMode = e.target.value; updatePreview(); };
    document.getElementById('close-btn').onclick = () => { overlay.style.display = 'none'; resetZoom(); };
    seekbar.oninput = () => { currentIndex = parseInt(seekbar.value); updatePreview(); resetIdleTimer(); };
</script>
</body>
</html>
