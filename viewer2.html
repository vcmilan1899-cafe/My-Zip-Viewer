<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zip電子書籍ビューワー</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #eee; }
        body { background: var(--bg-color); color: var(--text-color); font-family: sans-serif; margin: 0; overflow-x: hidden; }
        
        header { padding: 10px; background: #333; position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; font-size: 14px; }
        
        #thumbnail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; padding: 10px; }
        .thumb-container { cursor: pointer; background: #000; display: flex; flex-direction: column; align-items: center; border-radius: 4px; overflow: hidden; }
        .thumb-container img { width: 100%; height: 160px; object-fit: contain; }
        .thumb-label { font-size: 11px; padding: 3px; }

        #preview-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; flex-direction: column; align-items: center; justify-content: center; touch-action: none; }
        #main-image { max-height: 100%; max-width: 100%; object-fit: contain; }
        
        /* ページめくりボタン（スマホでは透明に近く） */
        .nav-btn { position: absolute; top: 0; height: 100%; width: 15%; background: none; border: none; color: white; font-size: 2rem; cursor: pointer; opacity: 0.1; z-index: 110; }
        #prev-btn { left: 0; }
        #next-btn { right: 0; }
        
        #close-btn { position: absolute; top: 10px; left: 10px; background: rgba(255,68,68,0.8); color: white; border: none; padding: 8px 15px; cursor: pointer; z-index: 120; border-radius: 5px; }
        
        /* 下部シークバー */
        #seekbar-container { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.7); padding: 15px 0; display: flex; flex-direction: column; align-items: center; z-index: 120; }
        #seekbar { width: 80%; cursor: pointer; }
        #page-count { margin-top: 5px; font-size: 14px; }
    </style>
</head>
<body>

<header>
    <input type="file" id="zip-input" accept=".zip">
    <div id="status">Zipを選択</div>
</header>

<div id="thumbnail-grid"></div>

<div id="preview-overlay">
    <button id="close-btn">閉じる</button>
    <button class="nav-btn" id="prev-btn">◀</button>
    <img id="main-image" src="">
    <button class="nav-btn" id="next-btn">▶</button>
    
    <div id="seekbar-container">
        <input type="range" id="seekbar" min="0" value="0" step="1">
        <div id="page-count"></div>
    </div>
</div>

<script>
    let images = [];
    let currentIndex = 0;

    const zipInput = document.getElementById('zip-input');
    const grid = document.getElementById('thumbnail-grid');
    const overlay = document.getElementById('preview-overlay');
    const mainImg = document.getElementById('main-image');
    const seekbar = document.getElementById('seekbar');
    const pageCount = document.getElementById('page-count');

    // ZIP読み込み処理
    zipInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        grid.innerHTML = "読込中...";
        const zip = await JSZip.loadAsync(file);
        const fileList = [];
        zip.forEach((path, entry) => { if (/\.(jpe?g|png|gif|webp)$/i.test(path)) fileList.push(entry); });
        fileList.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true}));
        images = await Promise.all(fileList.map(async (f) => URL.createObjectURL(await f.async("blob"))));
        renderThumbnails();
        seekbar.max = images.length - 1;
        document.getElementById('status').textContent = `${images.length}枚`;
    });

    function renderThumbnails() {
        grid.innerHTML = "";
        images.forEach((src, index) => {
            const div = document.createElement('div');
            div.className = 'thumb-container';
            div.innerHTML = `<img src="${src}"><div class="thumb-label">${index + 1}</div>`;
            div.onclick = () => openPreview(index);
            grid.appendChild(div);
        });
    }

    function openPreview(index) {
        currentIndex = index;
        updatePreview();
        overlay.style.display = 'flex';
    }

    function updatePreview() {
        mainImg.src = images[currentIndex];
        pageCount.textContent = `${currentIndex + 1} / ${images.length}`;
        seekbar.value = currentIndex;
    }

    // シークバー操作
    seekbar.oninput = () => {
        currentIndex = parseInt(seekbar.value);
        updatePreview();
    };

    // スワイプ操作の実装
    let touchStartX = 0;
    overlay.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; }, false);
    overlay.addEventListener('touchend', (e) => {
        let touchEndX = e.changedTouches[0].screenX;
        let diff = touchStartX - touchEndX;
        if (Math.abs(diff) > 50) { // 50px以上動いたらスワイプと判定
            if (diff > 0) nextPrev(1); // 左スワイプで次へ
            else nextPrev(-1);         // 右スワイプで前へ
        }
    }, false);

    function nextPrev(n) {
        currentIndex += n;
        if (currentIndex < 0) currentIndex = 0;
        if (currentIndex >= images.length) currentIndex = images.length - 1;
        updatePreview();
    }

    document.getElementById('close-btn').onclick = () => { overlay.style.display = 'none'; };
    document.getElementById('prev-btn').onclick = (e) => { e.stopPropagation(); nextPrev(-1); };
    document.getElementById('next-btn').onclick = (e) => { e.stopPropagation(); nextPrev(1); };
</script>
</body>
</html>
