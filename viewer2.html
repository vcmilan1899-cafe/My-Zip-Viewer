<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zip電子書籍ビューワー Pro Max</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pinch-zoom-js@2.3.5/dist/pinch-zoom.min.js"></script>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #eee; }
        body { background: var(--bg-color); color: var(--text-color); font-family: sans-serif; margin: 0; overflow: hidden; touch-action: none; }
        header { padding: 10px; background: #333; position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        #thumbnail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; padding: 10px; height: calc(100vh - 60px); overflow-y: auto; }
        .thumb-container { cursor: pointer; background: #000; display: flex; flex-direction: column; align-items: center; border-radius: 4px; overflow: hidden; }
        .thumb-container img { width: 100%; height: 160px; object-fit: contain; }
        
        #preview-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; flex-direction: column; align-items: center; justify-content: center; }
        
        /* 拡大用コンテナ */
        #zoom-container { width: 100%; height: 100%; overflow: hidden; }
        #image-area { display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; }
        .viewer-img { max-height: 100%; max-width: 100%; object-fit: contain; }
        .spread { max-width: 50% !important; }

        #controls-panel, #close-btn { transition: opacity 0.3s, visibility 0.3s; opacity: 1; visibility: visible; }
        .hide { opacity: 0 !important; visibility: hidden !important; }
        #close-btn { position: absolute; top: 10px; left: 10px; background: rgba(255,68,68,0.8); color: white; border: none; padding: 8px 15px; cursor: pointer; z-index: 120; border-radius: 5px; }
        #controls-panel { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.8); padding: 10px 0; display: flex; flex-direction: column; align-items: center; z-index: 120; font-size: 12px; }
        .setting-row { display: flex; gap: 15px; margin-bottom: 10px; align-items: center; }
        #seekbar { width: 85%; margin-bottom: 5px; }
        select { background: #444; color: white; border: 1px solid #666; padding: 3px; border-radius: 3px; }
    </style>
</head>
<body>

<header id="main-header">
    <input type="file" id="zip-input" accept=".zip">
    <div id="status">Zipを選択</div>
</header>

<div id="thumbnail-grid"></div>

<div id="preview-overlay">
    <button id="close-btn">一覧</button>
    <div id="zoom-container">
        <div id="image-area">
            <img id="img-left" class="viewer-img">
            <img id="img-right" class="viewer-img">
        </div>
    </div>
    
    <div id="controls-panel">
        <div class="setting-row">
            <label>開き方: <select id="direction-set"><option value="rtl">右開き(漫画)</option><option value="ltr">左開き</option></select></label>
            <label>表示: <select id="view-mode"><option value="single">単ページ</option><option value="double">見開き</option></select></label>
        </div>
        <input type="range" id="seekbar" min="0" value="0" step="1">
        <div id="page-count"></div>
    </div>
</div>

<script>
    let images = [];
    let currentIndex = 0;
    let idleTimer;
    let pz;
    const state = { direction: 'rtl', viewMode: 'single' };
    const UI_ELEMENTS = ['controls-panel', 'close-btn'];

    const overlay = document.getElementById('preview-overlay');
    const imgL = document.getElementById('img-left');
    const imgR = document.getElementById('img-right');
    const seekbar = document.getElementById('seekbar');

    // ZIP読み込み
    document.getElementById('zip-input').onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        document.getElementById('thumbnail-grid').innerHTML = "読込中...";
        const zip = await JSZip.loadAsync(file);
        const fileList = [];
        zip.forEach((path, entry) => { if (/\.(jpe?g|png|gif|webp)$/i.test(path)) fileList.push(entry); });
        fileList.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true}));
        images = await Promise.all(fileList.map(async (f) => URL.createObjectURL(await f.async("blob"))));
        renderThumbnails();
        seekbar.max = images.length - 1;
        document.getElementById('status').textContent = `${images.length}枚`;
    };

    function renderThumbnails() {
        const grid = document.getElementById('thumbnail-grid');
        grid.innerHTML = "";
        images.forEach((src, index) => {
            const div = document.createElement('div');
            div.className = 'thumb-container';
            div.innerHTML = `<img src="${src}"><div style="font-size:10px">${index + 1}</div>`;
            div.onclick = () => { 
                currentIndex = index; 
                updatePreview(); 
                overlay.style.display = 'flex'; 
                initZoom();
                showUI();
            };
            grid.appendChild(div);
        });
    }

    function initZoom() {
        if (pz) pz.destroy();
        pz = new PinchZoom(document.getElementById('zoom-container'), {
            draggableUnzoomed: false,
            minZoom: 1,
            onDoubleTap: function(e) {
                // 中央タップならメニュー、端なら拡大
                const x = (e.touches ? e.touches[0].clientX : e.clientX);
                const width = window.innerWidth;
                if (x > width * 0.2 && x < width * 0.8) {
                    toggleUI();
                }
            }
        });
    }

    function updatePreview() {
        const isDouble = state.viewMode === 'double';
        const isRTL = state.direction === 'rtl';
        imgL.style.display = 'none'; imgR.style.display = 'none';

        if (!isDouble) {
            imgL.src = images[currentIndex];
            imgL.className = 'viewer-img';
            imgL.style.display = 'block';
        } else {
            let first = currentIndex;
            let second = currentIndex + 1;
            if (second >= images.length) second = null;
            imgL.style.display = 'block';
            imgR.style.display = second !== null ? 'block' : 'none';
            imgL.className = 'viewer-img spread';
            imgR.className = 'viewer-img spread';
            if (isRTL) {
                imgR.src = images[first];
                if (second !== null) imgL.src = images[second];
            } else {
                imgL.src = images[first];
                if (second !== null) imgR.src = images[second];
            }
        }
        document.getElementById('page-count').textContent = `${currentIndex + 1} / ${images.length}`;
        seekbar.value = currentIndex;
    }

    function nextPrev(step) {
        if (pz && pz.zoomFactor > 1) return; // 拡大中はめくらない
        const move = state.viewMode === 'double' ? step * 2 : step;
        currentIndex += (state.direction === 'rtl' ? -move : move);
        if (currentIndex < 0) currentIndex = 0;
        if (currentIndex >= images.length) currentIndex = images.length - 1;
        updatePreview();
    }

    // UI制御
    function toggleUI() {
        const isHidden = document.getElementById('controls-panel').classList.contains('hide');
        isHidden ? showUI() : hideUI();
    }
    function showUI() {
        UI_ELEMENTS.forEach(id => document.getElementById(id).classList.remove('hide'));
        resetIdleTimer();
    }
    function hideUI() {
        clearTimeout(idleTimer);
        UI_ELEMENTS.forEach(id => document.getElementById(id).classList.add('hide'));
    }
    function resetIdleTimer() {
        clearTimeout(idleTimer);
        if (overlay.style.display === 'flex') idleTimer = setTimeout(hideUI, 3000);
    }

    // クリック・スワイプの統合判定
    let startX = 0;
    overlay.addEventListener('touchstart', (e) => { 
        startX = e.touches[0].pageX; 
        resetIdleTimer();
    });
    overlay.addEventListener('touchend', (e) => {
        if (pz && pz.zoomFactor > 1) return; // 拡大中はページめくり無効
        let diff = startX - e.changedTouches[0].pageX;
        if (Math.abs(diff) > 50) {
            nextPrev(diff > 0 ? 1 : -1);
        } else {
            const x = e.changedTouches[0].clientX;
            const width = window.innerWidth;
            if (x < width * 0.2) nextPrev(-1);
            else if (x > width * 0.8) nextPrev(1);
            else toggleUI();
        }
    });

    document.getElementById('direction-set').onchange = (e) => { state.direction = e.target.value; updatePreview(); };
    document.getElementById('view-mode').onchange = (e) => { state.viewMode = e.target.value; updatePreview(); };
    document.getElementById('close-btn').onclick = () => { overlay.style.display = 'none'; if(pz) pz.destroy(); };
    seekbar.oninput = () => { currentIndex = parseInt(seekbar.value); updatePreview(); resetIdleTimer(); };
</script>
</body>
</html>
