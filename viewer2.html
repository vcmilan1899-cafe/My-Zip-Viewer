<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zip Viewer Pro Max</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #eee; }
        body { background: var(--bg-color); color: var(--text-color); font-family: sans-serif; margin: 0; overflow: hidden; touch-action: none; }
        
        header { height: 50px; padding: 0 10px; background: #333; display: flex; align-items: center; gap: 10px; z-index: 10; box-sizing: border-box; }
        
        #thumbnail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; padding: 10px; height: calc(100svh - 50px); overflow-y: auto; touch-action: auto; }
        .thumb-container { cursor: pointer; background: #000; border-radius: 4px; overflow: hidden; text-align: center; height: 150px; }
        .thumb-container img { width: 100%; height: 120px; object-fit: contain; background: #222; }
        
        #preview-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100svh; background: #000; z-index: 100; flex-direction: column; overflow: hidden; }
        
        #zoom-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; cursor: grab; position: relative; }
        #image-area { display: flex; justify-content: center; align-items: center; transition: transform 0.05s linear; transform-origin: center; will-change: transform; }
        .viewer-img { max-height: 100svh; max-width: 100vw; object-fit: contain; pointer-events: none; }
        
        #controls-panel, #close-btn { transition: opacity 0.3s, visibility 0.3s; z-index: 200; pointer-events: auto; }
        .hide { opacity: 0 !important; visibility: hidden !important; }
        #close-btn { position: absolute; top: env(safe-area-inset-top, 15px); left: 15px; background: rgba(255,68,68,0.9); color: white; border: none; padding: 12px 20px; cursor: pointer; border-radius: 8px; font-weight: bold; }
        #controls-panel { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.85); padding: 20px 0; padding-bottom: calc(20px + env(safe-area-inset-bottom, 5px)); display: flex; flex-direction: column; align-items: center; font-size: 14px; }
        
        .setting-row { display: flex; gap: 15px; margin-bottom: 10px; }
        select { background: #444; color: white; border: 1px solid #666; padding: 8px 12px; border-radius: 6px; font-size: 14px; }
        #seekbar { width: 85%; height: 40px; }
    </style>
</head>
<body>

<header id="main-header">
    <input type="file" id="zip-input" accept=".zip">
    <span id="status">Zipを選択</span>
</header>

<div id="thumbnail-grid"></div>

<div id="preview-overlay">
    <button id="close-btn">一覧</button>
    <div id="zoom-container">
        <div id="image-area">
            <img id="img-left" class="viewer-img">
            <img id="img-right" class="viewer-img">
        </div>
    </div>
    <div id="controls-panel">
        <div class="setting-row">
            <select id="direction-set"><option value="rtl">右開き (漫画)</option><option value="ltr">左開き</option></select>
            <select id="view-mode"><option value="single">単ページ</option><option value="double">見開き</option></select>
        </div>
        <input type="range" id="seekbar" min="0" value="0" step="1">
        <div id="page-count">0 / 0</div>
    </div>
</div>

<script>
    let zipEntries = [], blobCache = new Map(), currentIndex = 0, idleTimer;
    const state = { direction: 'rtl', viewMode: 'single' };

    let scale = 1, posX = 0, posY = 0, startX = 0, startY = 0, isDragging = false;
    let initialPinchDistance = 0, touchStartTime = 0, startPoint = { x: 0, y: 0 }, isDoublePinch = false;

    const overlay = document.getElementById('preview-overlay');
    const imageArea = document.getElementById('image-area');
    const seekbar = document.getElementById('seekbar');

    // --- ZIP読み込み ---
    document.getElementById('zip-input').onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        document.getElementById('thumbnail-grid').innerHTML = "解析中...";
        blobCache.forEach(url => URL.revokeObjectURL(url));
        blobCache.clear();
        
        const zip = await JSZip.loadAsync(file);
        zipEntries = [];
        zip.forEach((path, entry) => { if (/\.(jpe?g|png|gif|webp)$/i.test(path)) zipEntries.push(entry); });
        zipEntries.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true}));
        
        document.getElementById('status').textContent = `${zipEntries.length}枚`;
        seekbar.max = zipEntries.length - 1;
        renderThumbnails();
    };

    function renderThumbnails() {
        const grid = document.getElementById('thumbnail-grid');
        grid.innerHTML = "";
        zipEntries.forEach((entry, index) => {
            const div = document.createElement('div');
            div.className = 'thumb-container';
            div.innerHTML = `<div style="margin-top:60px; font-size:10px;">...</div>`;
            div.onclick = () => { currentIndex = index; overlay.style.display = 'flex'; updatePreview(); showUI(); };
            grid.appendChild(div);
            (async () => {
                const blob = await entry.async("blob");
                div.innerHTML = `<img src="${URL.createObjectURL(blob)}"><div style="font-size:10px">${index + 1}</div>`;
            })();
        });
    }

    async function getImageUrl(index) {
        if (index < 0 || index >= zipEntries.length) return null;
        if (blobCache.has(index)) return blobCache.get(index);
        const blob = await zipEntries[index].async("blob");
        const url = URL.createObjectURL(blob);
        blobCache.set(index, url);
        if (blobCache.size > 15) { const key = blobCache.keys().next().value; URL.revokeObjectURL(blobCache.get(key)); blobCache.delete(key); }
        return url;
    }

    async function updatePreview() {
        resetZoom();
        const url1 = await getImageUrl(currentIndex);
        const imgL = document.getElementById('img-left'), imgR = document.getElementById('img-right');
        imgL.style.display = 'none'; imgR.style.display = 'none';

        if (state.viewMode === 'single') {
            imgL.src = url1; imgL.style.display = 'block';
        } else {
            const url2 = await getImageUrl(currentIndex + 1);
            imgL.style.display = 'block'; imgR.style.display = url2 ? 'block' : 'none';
            if (state.direction === 'rtl') { imgR.src = url1; if(url2) imgL.src = url2; }
            else { imgL.src = url1; if(url2) imgR.src = url2; }
        }
        document.getElementById('page-count').textContent = `${currentIndex + 1} / ${zipEntries.length}`;
        seekbar.value = currentIndex;
    }

    function resetZoom() { scale = 1; posX = 0; posY = 0; applyTransform(); }
    function applyTransform() { imageArea.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`; }

    // --- インタラクション判定 ---
    function isUITarget(e) { return e.target.closest('#controls-panel') || e.target.closest('#close-btn'); }

    function onStart(e) {
        if (isUITarget(e)) return;
        const touch = e.touches ? e.touches[0] : e;
        touchStartTime = Date.now();
        startPoint = { x: touch.pageX, y: touch.pageY };
        
        if (e.touches && e.touches.length === 2) {
            isDoublePinch = true;
            initialPinchDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
        } else {
            isDoublePinch = false;
            isDragging = true;
            startX = touch.pageX - posX;
            startY = touch.pageY - posY;
        }
        resetIdleTimer();
    }

    function onMove(e) {
        if (!isDragging && !isDoublePinch) return;
        if (isUITarget(e)) return;

        if (e.touches && e.touches.length === 2) {
            e.preventDefault();
            const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            scale = Math.min(Math.max(1, scale * (dist / initialPinchDistance)), 5);
            initialPinchDistance = dist;
            applyTransform();
        } else if (isDragging && scale > 1) {
            e.preventDefault();
            const touch = e.touches ? e.touches[0] : e;
            posX = touch.pageX - startX;
            posY = touch.pageY - startY;
            applyTransform();
        }
    }

    function onEnd(e) {
        if (isUITarget(e)) { isDragging = false; return; }
        
        const duration = Date.now() - touchStartTime;
        const endTouch = e.changedTouches ? e.changedTouches[0] : e;
        const moveDistX = endTouch.pageX - startPoint.x;
        const moveDistY = endTouch.pageY - startPoint.y;
        const totalDist = Math.hypot(moveDistX, moveDistY);

        if (totalDist < 15 && duration < 300) {
            e.preventDefault(); 
            handleInteraction(endTouch.pageX);
        } else if (scale === 1 && Math.abs(moveDistX) > 50 && !isDoublePinch) {
            nextPrev(moveDistX > 0 ? -1 : 1);
        }
        isDragging = false;
        isDoublePinch = false;
    }

    function handleInteraction(x) {
        const width = window.innerWidth;
        if (x < width * 0.25) nextPrev(-1);
        else if (x > width * 0.75) nextPrev(1);
        else toggleUI();
    }

    function toggleUI() {
        const panel = document.getElementById('controls-panel');
        panel.classList.contains('hide') ? showUI() : hideUI();
    }

    function nextPrev(n) {
        if (scale > 1) return;
        const step = (state.viewMode === 'double' ? 2 : 1) * n;
        currentIndex += (state.direction === 'rtl' ? -step : step);
        currentIndex = Math.max(0, Math.min(currentIndex, zipEntries.length - 1));
        updatePreview();
    }

    // --- UI制御 ---
    function showUI() { document.getElementById('controls-panel').classList.remove('hide'); document.getElementById('close-btn').classList.remove('hide'); resetIdleTimer(); }
    function hideUI() { clearTimeout(idleTimer); document.getElementById('controls-panel').classList.add('hide'); document.getElementById('close-btn').classList.add('hide'); }
    function resetIdleTimer() { clearTimeout(idleTimer); if (overlay.style.display === 'flex') idleTimer = setTimeout(hideUI, 4000); }

    // --- イベントリスナー ---
    overlay.addEventListener('touchstart', onStart, { passive: false });
    overlay.addEventListener('touchmove', onMove, { passive: false });
    overlay.addEventListener('touchend', onEnd, { passive: false });
    overlay.addEventListener('mousedown', onStart);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onEnd);
    overlay.addEventListener('wheel', (e) => {
        e.preventDefault();
        const delta = e.deltaY > 0 ? 0.9 : 1.1;
        scale = Math.min(Math.max(1, scale * delta), 5);
        if (scale === 1) { posX = 0; posY = 0; }
        applyTransform();
    }, { passive: false });

    document.getElementById('direction-set').onchange = (e) => { state.direction = e.target.value; updatePreview(); };
    document.getElementById('view-mode').onchange = (e) => { state.viewMode = e.target.value; updatePreview(); };
    document.getElementById('close-btn').onclick = (e) => { e.stopPropagation(); overlay.style.display = 'none'; resetZoom(); };
    seekbar.oninput = () => { currentIndex = parseInt(seekbar.value); updatePreview(); resetIdleTimer(); };
    
    document.addEventListener('keydown', (e) => {
        if (overlay.style.display === 'flex') {
            if (e.key === "ArrowLeft") nextPrev(-1);
            if (e.key === "ArrowRight") nextPrev(1);
            if (e.key === "Escape") document.getElementById('close-btn').click();
        }
    });
</script>
</body>
</html>
