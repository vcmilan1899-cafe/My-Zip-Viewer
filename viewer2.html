<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zip電子書籍ビューワー Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #eee; }
        body { background: var(--bg-color); color: var(--text-color); font-family: sans-serif; margin: 0; overflow-x: hidden; }
        header { padding: 10px; background: #333; position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        
        #thumbnail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; padding: 10px; }
        .thumb-container { cursor: pointer; background: #000; display: flex; flex-direction: column; align-items: center; border-radius: 4px; overflow: hidden; }
        .thumb-container img { width: 100%; height: 160px; object-fit: contain; }
        
        #preview-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; flex-direction: column; align-items: center; justify-content: center; touch-action: none; }
        
        /* 画像表示エリア */
        #image-area { display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; overflow: hidden; }
        .viewer-img { max-height: 100%; max-width: 100%; object-fit: contain; }
        .spread { max-width: 50% !important; }

        .nav-btn { position: absolute; top: 0; height: 100%; width: 20%; background: none; border: none; color: white; font-size: 2rem; cursor: pointer; opacity: 0; z-index: 110; }
        #close-btn { position: absolute; top: 10px; left: 10px; background: rgba(255,68,68,0.8); color: white; border: none; padding: 8px 15px; cursor: pointer; z-index: 120; border-radius: 5px; }
        
        /* 下部コントロールパネル */
        #controls-panel { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.8); padding: 10px 0; display: flex; flex-direction: column; align-items: center; z-index: 120; font-size: 12px; }
        .setting-row { display: flex; gap: 15px; margin-bottom: 10px; align-items: center; }
        #seekbar { width: 85%; margin-bottom: 5px; }
        select { background: #444; color: white; border: 1px solid #666; padding: 3px; border-radius: 3px; }
    </style>
</head>
<body>

<header>
    <input type="file" id="zip-input" accept=".zip">
    <div id="status">Zipを選択</div>
</header>

<div id="thumbnail-grid"></div>

<div id="preview-overlay">
    <button id="close-btn">一覧</button>
    <button class="nav-btn" id="prev-area" style="left:0"></button>
    <button class="nav-btn" id="next-area" style="right:0"></button>
    
    <div id="image-area">
        <img id="img-left" class="viewer-img">
        <img id="img-right" class="viewer-img">
    </div>
    
    <div id="controls-panel">
        <div class="setting-row">
            <label>開き方: <select id="direction-set"><option value="rtl">右開き(漫画)</option><option value="ltr">左開き</option></select></label>
            <label>表示: <select id="view-mode"><option value="single">単ページ</option><option value="double">見開き</option></select></label>
        </div>
        <input type="range" id="seekbar" min="0" value="0" step="1">
        <div id="page-count"></div>
    </div>
</div>

<script>
// --- 自動非表示の制御 ---
let idleTimer;
const UI_ELEMENTS = ['controls-panel', 'close-btn'];

function showUI() {
    UI_ELEMENTS.forEach(id => {
        document.getElementById(id).classList.remove('hide');
    });
    resetIdleTimer();
}

function hideUI() {
    UI_ELEMENTS.forEach(id => {
        document.getElementById(id).classList.add('hide');
    });
}

function resetIdleTimer() {
    clearTimeout(idleTimer);
    if (overlay.style.display === 'flex') {
        idleTimer = setTimeout(hideUI, 3000); // 3秒後に非表示
    }
}

// プレビュー画面でのクリック/タップ判定
overlay.addEventListener('click', (e) => {
    const x = e.clientX;
    const width = window.innerWidth;
    
    // 画面の左右20%ずつを「ページめくりエリア」とする
    if (x < width * 0.2 || x > width * 0.8) {
        // ページをめくる時はUIを表示させない（タイマーもリセットしない）
        // ※ nextPrev() 内で UI が表示されないように制御
    } else {
        // 画面の中央（20%〜80%の間）をタップした時だけUIを表示する
        showUI();
    }
});

// スワイプ操作（ここでもUIを表示させないようにする）
overlay.ontouchend = (e) => {
    let diff = startX - e.changedTouches[0].pageX;
    if (Math.abs(diff) > 50) {
        nextPrev(diff > 0 ? 1 : -1);
        // ページをめくった後はUIを表示させず、もし出ていれば隠す方向に倒す
        // (お好みで hideUI() を入れても良いですが、基本はそのままでOK)
    }
};

// ページ更新処理（元の関数をシンプルに維持）
function updatePreview() {
    const isDouble = state.viewMode === 'double';
    const isRTL = state.direction === 'rtl';

    imgL.style.display = 'none';
    imgR.style.display = 'none';

    if (!isDouble) {
        imgL.src = images[currentIndex];
        imgL.className = 'viewer-img';
        imgL.style.display = 'block';
    } else {
        let first = currentIndex;
        let second = currentIndex + 1;
        if (second >= images.length) second = null;

        imgL.style.display = 'block';
        imgR.style.display = second !== null ? 'block' : 'none';
        imgL.className = 'viewer-img spread';
        imgR.className = 'viewer-img spread';

        if (isRTL) {
            imgR.src = images[first];
            if (second !== null) imgL.src = images[second];
        } else {
            imgL.src = images[first];
            if (second !== null) imgR.src = images[second];
        }
    }
    pageCount.textContent = `${currentIndex + 1} / ${images.length}`;
    seekbar.value = currentIndex;
    // ここにあった resetIdleTimer() を削除することで、めくるたびに出るのを防ぎます
}
</script>
</body>
</html>
