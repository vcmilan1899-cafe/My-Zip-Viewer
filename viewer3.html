<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#333333">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Zip Viewer">
    <title>Universal Web Reader Pro</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #eee; --accent-color: #4488ff; }
        body { background: var(--bg-color); color: var(--text-color); font-family: sans-serif; margin: 0; overflow: hidden; touch-action: none; display: flex; flex-direction: column; height: 100svh; height: 100dvh; }
        header { flex-shrink: 0; min-height: 50px; height: auto; padding: 8px 12px; margin-top: calc(-1 * env(safe-area-inset-top, 0px)); background: #333; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; z-index: 10; box-sizing: border-box; gap: 8px; }
        @supports (-webkit-touch-callout: none) {
            header { margin-top: 0; padding-top: max(8px, env(safe-area-inset-top, 0px)); }
        }
        #header-side { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
        #status { font-size: 14px; color: #ffeb3b; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #init-screen { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px; text-align: center; padding: 20px; }
        .btn-primary { background: var(--accent-color); color: white; padding: 15px 30px; border-radius: 8px; cursor: pointer; font-weight: bold; border: none; }
        input[type="file"] { display: none; }
        #thumbnail-grid { display: none; flex: 1; min-height: 0; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; padding: 10px; overflow-y: auto; touch-action: auto; }
        .thumb-container { cursor: pointer; background: #000; border-radius: 4px; overflow: hidden; text-align: center; height: 150px; box-sizing: border-box; }
        .thumb-container img { width: 100%; height: 120px; object-fit: contain; background: #222; }
        .thumb-container.current { outline: 3px solid var(--accent-color); outline-offset: -3px; }
        .thumb-container.current .thumb-page { color: #ffeb3b; font-weight: bold; }
        #resume-btn, #open-other-btn, #local-shelf-btn { color: white; border: none; border-radius: 16px; padding: 6px 12px; font-size: 13px; font-weight: bold; cursor: pointer; white-space: nowrap; }
        #resume-btn, #open-other-btn { display: none; }
        #resume-btn { background: var(--accent-color); }
        #open-other-btn, #local-shelf-btn { background: #555; border: 1px solid #777; }
        #list-tools { display: none; gap: 8px; padding: 8px 10px; flex-wrap: wrap; flex-shrink: 0; }
        #list-tools.show { display: flex; }
        #list-tools button, #save-row button { background: #444; color: #fff; border: 1px solid #666; padding: 8px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; }
        #save-row { display: none; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
        #save-row.show { display: flex; }
        #local-shelf { display: none; flex: 1; min-height: 0; overflow-y: auto; touch-action: auto; padding: 10px; }
        #local-shelf-note { color: #aaa; font-size: 12px; margin: 0 0 10px; }
        #local-shelf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
        .local-book { background: #000; border-radius: 4px; overflow: hidden; text-align: center; cursor: pointer; }
        .local-book img { width: 100%; height: 140px; object-fit: contain; background: #222; display: block; }
        .local-book .local-name { font-size: 11px; padding: 6px 4px 2px; word-break: break-all; }
        .local-book .local-delete { margin: 0 0 8px; background: transparent; color: #f88; border: none; font-size: 11px; cursor: pointer; }
        #preview-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100svh; background: #000; z-index: 100; flex-direction: column; overflow: hidden; outline: none; }
        #zoom-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; cursor: grab; position: relative; }
        #image-area { display: flex; justify-content: center; align-items: center; transition: transform 0.05s linear; transform-origin: center; will-change: transform; }
        .viewer-img { max-height: 100svh; max-width: 100vw; object-fit: contain; pointer-events: none; }
        #controls-panel, #close-btn, #fullscreen-btn { transition: opacity 0.3s, visibility 0.3s; z-index: 200; pointer-events: auto; }
        .hide { opacity: 0 !important; visibility: hidden !important; }
        #close-btn { position: absolute; top: max(15px, env(safe-area-inset-top, 15px)); left: 15px; background: rgba(255,68,68,0.9); color: white; border: none; padding: 12px 20px; cursor: pointer; border-radius: 8px; font-weight: bold; }
        #fullscreen-btn { position: absolute; top: max(15px, env(safe-area-inset-top, 15px)); right: 15px; background: rgba(68,153,255,0.9); color: white; border: none; padding: 12px 20px; cursor: pointer; border-radius: 8px; font-weight: bold; }
        #controls-panel { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.85); padding: 20px 0; padding-bottom: calc(20px + env(safe-area-inset-bottom, 5px)); display: flex; flex-direction: column; align-items: center; font-size: 14px; }
        .setting-row { display: flex; gap: 10px; margin-bottom: 12px; }
        .toggle-btn { background: #444; color: #fff; border: 1px solid #666; padding: 10px 20px; border-radius: 25px; font-size: 13px; cursor: pointer; transition: all 0.2s; min-width: 100px; text-align: center; user-select: none; }
        .toggle-btn.active { background: var(--accent-color); border-color: #77aaff; font-weight: bold; }
        #seekbar-container { width: 85%; display: flex; justify-content: center; }
        #seekbar { width: 100%; height: 40px; cursor: pointer; }
        .rtl-bar { direction: rtl; }
        .ltr-bar { direction: ltr; }
        #page-count { margin-top: 5px; font-weight: bold; }
        #volume-row { display: none; gap: 10px; margin-top: 12px; }
        #volume-row.show { display: flex; }
        #btn-prev-vol, #btn-next-vol { background: #444; color: #fff; border: 1px solid #666; padding: 10px 18px; border-radius: 25px; font-size: 13px; cursor: pointer; min-width: 100px; }
        #btn-prev-vol:disabled, #btn-next-vol:disabled { opacity: .35; cursor: default; }
        #volume-toast { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.35); z-index: 300; opacity: 0; visibility: hidden; transition: opacity 0.28s ease, visibility 0.28s ease; pointer-events: none; }
        #volume-toast.show { opacity: 1; visibility: visible; pointer-events: auto; }
        #volume-toast span { background: rgba(0,0,0,0.75); color: #fff; padding: 16px 28px; border-radius: 12px; font-size: 16px; font-weight: bold; letter-spacing: 0.04em; text-align: center; }
    </style>
</head>
<body>

<header>
    <div id="header-side">
        <button type="button" id="local-shelf-btn">端末の本</button>
        <button type="button" id="open-other-btn">別の本</button>
    </div>
    <div id="status">待機中</div>
    <button type="button" id="resume-btn">続きから</button>
</header>

<div id="init-screen">
    <div id="init-msg">NASから開くか、ファイルを選択してください</div>
    <label class="btn-primary">ファイルを選択<input type="file" id="file-input" accept=".zip"></label>
</div>

<div id="list-tools">
    <button type="button" id="btn-save-book">この本を端末に保存</button>
    <button type="button" id="btn-save-next">次の巻も保存</button>
</div>

<div id="thumbnail-grid"></div>

<div id="local-shelf">
    <p id="local-shelf-note"></p>
    <div id="local-shelf-grid"></div>
</div>

<div id="preview-overlay" tabindex="0">
    <button id="close-btn">一覧</button>
    <button id="fullscreen-btn">全画面</button>
    <div id="zoom-container">
        <div id="image-area">
            <img id="img-left" class="viewer-img">
            <img id="img-right" class="viewer-img">
        </div>
    </div>
    <div id="controls-panel">
        <div class="setting-row">
            <div id="btn-direction" class="toggle-btn">右開き</div>
            <div id="btn-viewmode" class="toggle-btn">単ページ</div>
        </div>
        <div id="seekbar-container">
            <input type="range" id="seekbar" min="0" value="0" step="1">
        </div>
        <div id="page-count">0 / 0</div>
        <div id="volume-row">
            <button type="button" id="btn-prev-vol">前の巻</button>
            <button type="button" id="btn-next-vol">次の巻</button>
        </div>
        <div id="save-row">
            <button type="button" id="btn-save-book-view">この本を端末に保存</button>
            <button type="button" id="btn-save-next-view">次の巻も保存</button>
        </div>
        </div>
</div>
<div id="volume-toast" aria-live="polite"><span></span></div>

<script>
    let zipEntries = [], blobCache = new Map(), currentIndex = 0, idleTimer, currentFileUrl = "";
    let currentZipBlob = null;
    let hasOpenedViewer = false;
    let shelfCoverUrls = [];
    let series = null;
    let volumeLoading = false;
    const state = {
        direction: localStorage.getItem('viewer-direction') || 'rtl',
        viewMode: (window.innerWidth > window.innerHeight) ? 'double' : 'single'
    };
    let viewModeManualOverride = false;
    let lastIsLandscape = window.innerWidth > window.innerHeight;
    let wakeLock = null;
    let orientTimer;

    let scale = 1, posX = 0, posY = 0, startX = 0, startY = 0, isDragging = false;
    let initialPinchDistance = 0, touchStartTime = 0, startPoint = { x: 0, y: 0 }, isDoublePinch = false;

    const overlay = document.getElementById('preview-overlay');
    const imageArea = document.getElementById('image-area');
    const seekbar = document.getElementById('seekbar');
    const seekbarContainer = document.getElementById('seekbar-container');
    const statusTxt = document.getElementById('status');
    const initScreen = document.getElementById('init-screen');
    const thumbGrid = document.getElementById('thumbnail-grid');
    const btnDirection = document.getElementById('btn-direction');
    const btnViewMode = document.getElementById('btn-viewmode');
    const controlsPanel = document.getElementById('controls-panel');
    const resumeBtn = document.getElementById('resume-btn');
    const openOtherBtn = document.getElementById('open-other-btn');
    const fileInput = document.getElementById('file-input');
    const volumeRow = document.getElementById('volume-row');
    const btnPrevVol = document.getElementById('btn-prev-vol');
    const btnNextVol = document.getElementById('btn-next-vol');
    const volumeToast = document.getElementById('volume-toast');
    const volumeToastText = volumeToast.querySelector('span');
    const localShelfBtn = document.getElementById('local-shelf-btn');
    const localShelf = document.getElementById('local-shelf');
    const localShelfNote = document.getElementById('local-shelf-note');
    const localShelfGrid = document.getElementById('local-shelf-grid');
    const listTools = document.getElementById('list-tools');
    const saveRow = document.getElementById('save-row');
    const btnSaveNext = document.getElementById('btn-save-next');
    const btnSaveNextView = document.getElementById('btn-save-next-view');

    window.onload = () => {
        applyOrientationViewMode();
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
        }
        const params = new URLSearchParams(window.location.search);
        currentFileUrl = params.get('file');
        series = parseSeriesFromHash(currentFileUrl);
        applyBindDirection();
        updateVolumeButtons();
        if (currentFileUrl) loadFromUrl(currentFileUrl);
    };

    function parseSeriesFromHash(fileUrl) {
        const raw = (location.hash || '').replace(/^#/, '');
        if (!raw) return null;
        try {
            const data = JSON.parse(new URLSearchParams(raw).get('s') || '');
            if (!data || typeof data !== 'object') return null;
            const files = Array.isArray(data.f) ? data.f.map(String) : [];
            if (!files.length && fileUrl) files.push(fileUrl);
            if (!files.length && !data.t && !data.a) return null;
            let i = Number(data.i);
            if (!Number.isInteger(i) || i < 0 || i >= files.length) {
                i = fileUrl ? files.indexOf(fileUrl) : 0;
                if (i < 0) i = 0;
            }
            return { i, f: files, t: data.t ? String(data.t) : '', a: data.a ? String(data.a) : '' };
        } catch {
            return null;
        }
    }

    function seriesLocation(fileUrl, seriesData) {
        const u = new URL(location.href);
        u.searchParams.set('file', fileUrl);
        u.searchParams.set('dir', state.direction);
        const payload = { i: seriesData.i, f: seriesData.f };
        if (seriesData.t) payload.t = seriesData.t;
        if (seriesData.a) payload.a = seriesData.a;
        u.hash = 's=' + encodeURIComponent(JSON.stringify(payload));
        return u.pathname + u.search + u.hash;
    }

    function titleBindKey() {
        return series && series.t ? 'viewer-direction-title-' + series.t : '';
    }

    function resolveDirection() {
        const q = new URLSearchParams(location.search).get('dir');
        if (q === 'rtl' || q === 'ltr') return q;
        const key = titleBindKey();
        if (key) {
            const saved = localStorage.getItem(key);
            if (saved === 'rtl' || saved === 'ltr') return saved;
        }
        return localStorage.getItem('viewer-direction') || 'rtl';
    }

    function applyBindDirection() {
        state.direction = resolveDirection();
        applySettingStyles();
    }

    function persistDirection() {
        const key = titleBindKey();
        if (key) localStorage.setItem(key, state.direction);
        else localStorage.setItem('viewer-direction', state.direction);
        if (series && currentFileUrl) updateSeriesLocation();
        else {
            const u = new URL(location.href);
            u.searchParams.set('dir', state.direction);
            history.replaceState(null, '', u.pathname + u.search + u.hash);
        }
        if (!series || !series.t || !series.a) return;
        const api = String(series.a).replace(/\/+$/, '') + '/api/title/' + encodeURIComponent(series.t) + '/bind';
        fetch(api, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ bind: state.direction }),
        }).catch(() => {});
    }

    function updateSeriesLocation() {
        if (!series || !currentFileUrl) return;
        history.replaceState(null, '', seriesLocation(currentFileUrl, series));
    }

    function updateVolumeButtons() {
        const hasSeries = !!(series && series.f && series.f.length > 1);
        volumeRow.classList.toggle('show', hasSeries);
        if (!hasSeries) return;
        btnPrevVol.disabled = volumeLoading || series.i <= 0;
        btnNextVol.disabled = volumeLoading || series.i >= series.f.length - 1;
    }

    function isLandscape() {
        return window.innerWidth > window.innerHeight;
    }

    function isViewerOpen() {
        return overlay.style.display === 'flex';
    }

    function applyOrientationViewMode() {
        const landscape = isLandscape();
        if (lastIsLandscape !== landscape) {
            viewModeManualOverride = false;
            lastIsLandscape = landscape;
        }
        if (viewModeManualOverride) {
            applySettingStyles();
            return;
        }
        const nextMode = landscape ? 'double' : 'single';
        const changed = state.viewMode !== nextMode;
        state.viewMode = nextMode;
        applySettingStyles();
        if (changed && isViewerOpen() && zipEntries.length) updatePreview();
    }

    function onViewportChange() {
        clearTimeout(orientTimer);
        orientTimer = setTimeout(applyOrientationViewMode, 80);
    }
    window.addEventListener('resize', onViewportChange);
    window.addEventListener('orientationchange', onViewportChange);

    function applySettingStyles() {
        btnDirection.textContent = (state.direction === 'rtl') ? '右開き' : '左開き';
        btnDirection.classList.toggle('active', state.direction === 'ltr');
        btnViewMode.textContent = (state.viewMode === 'single') ? '単ページ' : '見開き';
        btnViewMode.classList.toggle('active', state.viewMode === 'double');
        seekbarContainer.className = (state.direction === 'rtl') ? 'rtl-bar' : 'ltr-bar';
    }

    async function requestWakeLock() {
        if (!('wakeLock' in navigator) || !isViewerOpen()) return;
        try {
            wakeLock = await navigator.wakeLock.request('screen');
            wakeLock.addEventListener('release', () => { wakeLock = null; });
        } catch (err) {
            wakeLock = null;
        }
    }

    async function releaseWakeLock() {
        if (!wakeLock) return;
        try { await wakeLock.release(); } catch (err) {}
        wakeLock = null;
    }

    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && isViewerOpen()) requestWakeLock();
        else releaseWakeLock();
    });

    fileInput.onchange = (e) => {
        const file = e.target.files[0];
        fileInput.value = "";
        if (!file) return;
        currentFileUrl = "local:" + file.name;
        series = null;
        applyBindDirection();
        updateVolumeButtons();
        processZip(file);
    };

    openOtherBtn.onclick = () => fileInput.click();

    async function loadFromUrl(url, opts) {
        const saved = await readSavedZip(url);
        if (saved) {
            statusTxt.textContent = "端末の本を開いています";
            return processZip(saved, opts);
        }
        statusTxt.textContent = "ダウンロード中...";
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error("取得失敗");
            const blob = await response.blob();
            return await processZip(blob, opts);
        } catch (err) {
            statusTxt.textContent = "取得失敗";
            if (!(opts && opts.stayOpen)) initScreen.style.display = 'flex';
            return false;
        }
    }

    async function loadVolume(delta, startAt) {
        if (volumeLoading || !series) return false;
        const ni = series.i + delta;
        if (ni < 0 || ni >= series.f.length) return false;
        volumeLoading = true;
        updateVolumeButtons();
        showVolumeToast(delta > 0 ? "次の巻へ移動しています。" : "前の巻へ移動しています。");
        statusTxt.textContent = delta > 0 ? "次の巻を読み込み中..." : "前の巻を読み込み中...";
        const url = series.f[ni];
        const prevUrl = currentFileUrl;
        const prevI = series.i;
        currentFileUrl = url;
        series.i = ni;
        try {
            const ok = await loadFromUrl(url, { stayOpen: true, startAt });
            if (ok) {
                updateSeriesLocation();
                updateVolumeButtons();
                return true;
            }
            currentFileUrl = prevUrl;
            series.i = prevI;
            updateVolumeButtons();
            return false;
        } finally {
            volumeLoading = false;
            updateVolumeButtons();
            hideVolumeToast();
        }
    }

    function showVolumeToast(message) {
        volumeToastText.textContent = message;
        volumeToast.classList.add('show');
    }

    function hideVolumeToast() {
        volumeToast.classList.remove('show');
    }

    function closeViewerOverlay() {
        if (!isViewerOpen()) return;
        overlay.style.display = 'none';
        resetZoom();
        releaseWakeLock();
    }

    function revokeCachedUrls() {
        blobCache.forEach((url) => URL.revokeObjectURL(url));
        blobCache.clear();
        thumbGrid.querySelectorAll('img').forEach((img) => {
            if (img.src.startsWith('blob:')) URL.revokeObjectURL(img.src);
        });
    }

    function updateOpenOtherButton() {
        openOtherBtn.style.display = zipEntries.length ? 'inline-block' : 'none';
    }

    function bookTitle(sourceUrl) {
        if (!sourceUrl) return "無題";
        if (sourceUrl.startsWith("local:")) return sourceUrl.slice(6);
        try {
            const last = decodeURIComponent(new URL(sourceUrl).pathname.split("/").filter(Boolean).pop() || "");
            return last || sourceUrl;
        } catch (err) {
            return sourceUrl;
        }
    }

    async function bookId(sourceUrl) {
        const text = String(sourceUrl || "book");
        if (crypto.subtle) {
            const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
            return [...new Uint8Array(buf)].slice(0, 12).map((b) => b.toString(16).padStart(2, "0")).join("");
        }
        return text.replace(/[^a-zA-Z0-9]/g, "").slice(-24) || "book";
    }

    async function booksRoot() {
        if (!navigator.storage || !navigator.storage.getDirectory) {
            throw new Error("このブラウザでは端末保存に対応していません");
        }
        const root = await navigator.storage.getDirectory();
        return root.getDirectoryHandle("books", { create: true });
    }

    async function writeOpfsFile(dir, name, data) {
        const handle = await dir.getFileHandle(name, { create: true });
        const writable = await handle.createWritable();
        await writable.write(data);
        await writable.close();
    }

    async function ensureSpace(bytes) {
        if (!navigator.storage || !navigator.storage.estimate) return;
        const estimate = await navigator.storage.estimate();
        const free = (estimate.quota || 0) - (estimate.usage || 0);
        if (bytes > free) {
            const mb = Math.max(0, Math.floor(free / 1024 / 1024));
            throw new Error(`空き容量が足りません（残り約${mb}MB）`);
        }
    }

    async function readSavedZip(sourceUrl) {
        if (!sourceUrl || !navigator.storage || !navigator.storage.getDirectory) return null;
        try {
            const root = await booksRoot();
            const dir = await root.getDirectoryHandle(await bookId(sourceUrl));
            const handle = await dir.getFileHandle("book.zip");
            return await handle.getFile();
        } catch (err) {
            return null;
        }
    }

    function updateSaveButtons() {
        const canSave = !!(currentZipBlob && zipEntries.length);
        const canSaveNext = !!(series && series.f && series.i < series.f.length - 1);
        listTools.classList.toggle("show", canSave && localShelf.style.display !== "block");
        saveRow.classList.toggle("show", canSave);
        btnSaveNext.style.display = canSaveNext ? "" : "none";
        btnSaveNextView.style.display = canSaveNext ? "" : "none";
    }

    async function saveZipToDevice(blob, sourceUrl, seriesData) {
        await ensureSpace(blob.size);
        if (navigator.storage && navigator.storage.persist) await navigator.storage.persist();
        const zip = await JSZip.loadAsync(blob);
        const images = [];
        zip.forEach((path, entry) => { if (/\.(jpe?g|png|gif|webp)$/i.test(path)) images.push(entry); });
        images.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
        if (!images.length) throw new Error("画像なし");
        const coverBlob = await images[0].async("blob");
        const id = await bookId(sourceUrl);
        const dir = await (await booksRoot()).getDirectoryHandle(id, { create: true });
        await writeOpfsFile(dir, "book.zip", blob);
        await writeOpfsFile(dir, "cover", coverBlob);
        const meta = {
            sourceUrl,
            name: bookTitle(sourceUrl),
            savedAt: Date.now(),
            size: blob.size,
            coverType: coverBlob.type || "image/jpeg",
            series: seriesData ? { i: seriesData.i, f: seriesData.f, t: seriesData.t || "", a: seriesData.a || "" } : null
        };
        await writeOpfsFile(dir, "meta.json", new Blob([JSON.stringify(meta)], { type: "application/json" }));
    }

    async function saveCurrentBook() {
        if (!currentZipBlob || !currentFileUrl) { alert("保存できる本がありません"); return; }
        showVolumeToast("端末に保存しています。");
        try {
            await saveZipToDevice(currentZipBlob, currentFileUrl, series);
            statusTxt.textContent = "端末に保存しました";
        } catch (err) {
            alert(err.message || "保存に失敗しました");
        } finally {
            hideVolumeToast();
        }
    }

    async function saveNextVolume() {
        if (!series || series.i >= series.f.length - 1) return;
        const url = series.f[series.i + 1];
        const nextSeries = { i: series.i + 1, f: series.f, t: series.t, a: series.a };
        showVolumeToast("次の巻を保存しています。");
        try {
            const saved = await readSavedZip(url);
            if (saved) {
                statusTxt.textContent = "次の巻は保存済みです";
                return;
            }
            const response = await fetch(url);
            if (!response.ok) throw new Error("取得失敗");
            const blob = await response.blob();
            await saveZipToDevice(blob, url, nextSeries);
            statusTxt.textContent = "次の巻を端末に保存しました";
        } catch (err) {
            alert(err.message || "保存に失敗しました");
        } finally {
            hideVolumeToast();
        }
    }

    function hideLocalShelf() {
        localShelf.style.display = "none";
        shelfCoverUrls.forEach((url) => URL.revokeObjectURL(url));
        shelfCoverUrls = [];
    }

    async function showLocalShelf() {
        closeViewerOverlay();
        initScreen.style.display = "none";
        thumbGrid.style.display = "none";
        listTools.classList.remove("show");
        localShelf.style.display = "block";
        localShelfGrid.innerHTML = "読み込み中...";
        shelfCoverUrls.forEach((url) => URL.revokeObjectURL(url));
        shelfCoverUrls = [];
        try {
            let freeNote = "";
            if (navigator.storage && navigator.storage.estimate) {
                const estimate = await navigator.storage.estimate();
                const freeMb = Math.max(0, Math.round(((estimate.quota || 0) - (estimate.usage || 0)) / 1024 / 1024));
                freeNote = `空き約 ${freeMb} MB`;
            }
            const root = await booksRoot();
            const books = [];
            for await (const [name, handle] of root.entries()) {
                if (handle.kind !== "directory") continue;
                try {
                    const metaFile = await (await handle.getFileHandle("meta.json")).getFile();
                    const meta = JSON.parse(await metaFile.text());
                    const coverFile = await (await handle.getFileHandle("cover")).getFile();
                    books.push({ id: name, meta, coverFile, dir: handle });
                } catch (err) {}
            }
            books.sort((a, b) => (b.meta.savedAt || 0) - (a.meta.savedAt || 0));
            localShelfNote.textContent = books.length ? `${books.length}冊　${freeNote}` : `保存した本はありません。${freeNote}`;
            localShelfGrid.innerHTML = "";
            books.forEach((book) => {
                const card = document.createElement("div");
                card.className = "local-book";
                const img = document.createElement("img");
                const coverUrl = URL.createObjectURL(book.coverFile);
                shelfCoverUrls.push(coverUrl);
                img.src = coverUrl;
                img.alt = book.meta.name || "";
                const name = document.createElement("div");
                name.className = "local-name";
                name.textContent = book.meta.name || "無題";
                const del = document.createElement("button");
                del.type = "button";
                del.className = "local-delete";
                del.textContent = "削除";
                card.appendChild(img);
                card.appendChild(name);
                card.appendChild(del);
                card.onclick = () => openSavedBook(book);
                del.onclick = (e) => { e.stopPropagation(); deleteSavedBook(book.id); };
                localShelfGrid.appendChild(card);
            });
        } catch (err) {
            localShelfNote.textContent = "";
            localShelfGrid.textContent = err.message || "端末の本を読めません";
        }
    }

    async function openSavedBook(book) {
        const file = await (await book.dir.getFileHandle("book.zip")).getFile();
        currentFileUrl = book.meta.sourceUrl || "";
        series = book.meta.series || null;
        applyBindDirection();
        updateVolumeButtons();
        if (series && currentFileUrl) updateSeriesLocation();
        hideLocalShelf();
        await processZip(file);
    }

    async function deleteSavedBook(id) {
        if (!confirm("この本を端末から削除しますか？")) return;
        const root = await booksRoot();
        await root.removeEntry(id, { recursive: true });
        showLocalShelf();
    }

    localShelfBtn.onclick = () => {
        if (localShelf.style.display === "block") {
            hideLocalShelf();
            if (zipEntries.length) {
                initScreen.style.display = "none";
                thumbGrid.style.display = "grid";
                updateSaveButtons();
            } else {
                initScreen.style.display = "flex";
            }
            return;
        }
        showLocalShelf();
    };
    document.getElementById("btn-save-book").onclick = () => saveCurrentBook();
    document.getElementById("btn-save-book-view").onclick = (e) => { e.stopPropagation(); saveCurrentBook(); };
    btnSaveNext.onclick = () => saveNextVolume();
    btnSaveNextView.onclick = (e) => { e.stopPropagation(); saveNextVolume(); };

    async function processZip(blob, opts) {
        const stayOpen = !!(opts && opts.stayOpen);
        const startAt = (opts && opts.startAt) || 'resume';
        try {
            currentZipBlob = blob;
            hideLocalShelf();
            const zip = await JSZip.loadAsync(blob);
            const nextEntries = [];
            zip.forEach((path, entry) => { if (/\.(jpe?g|png|gif|webp)$/i.test(path)) nextEntries.push(entry); });
            nextEntries.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
            if (nextEntries.length === 0) throw new Error("画像なし");
            if (!stayOpen) closeViewerOverlay();
            revokeCachedUrls();
            zipEntries = nextEntries;
            initScreen.style.display = 'none';
            thumbGrid.style.display = 'grid';
            statusTxt.textContent = `${zipEntries.length}枚`;
            seekbar.max = zipEntries.length - 1;
            if (startAt === 'last') currentIndex = Math.max(0, zipEntries.length - 1);
            else currentIndex = 0;
            hasOpenedViewer = stayOpen;
            updateResumeButton();
            updateOpenOtherButton();
            updateVolumeButtons();
            updateSaveButtons();
            renderThumbnails();
            if (stayOpen) {
                openViewer();
                return true;
            }
            const savedPage = localStorage.getItem('last-page-' + currentFileUrl);
            if (savedPage !== null && zipEntries[savedPage] && confirm("続きから読みますか？")) {
                currentIndex = parseInt(savedPage);
            }
            openViewer();
            return true;
        } catch (err) { alert(err.message); return false; }
    }

    function renderThumbnails() {
        thumbGrid.innerHTML = "";
        zipEntries.forEach((entry, index) => {
            const div = document.createElement('div');
            div.className = 'thumb-container';
            div.dataset.index = String(index);
            div.onclick = () => { currentIndex = index; openViewer(); };
            thumbGrid.appendChild(div);
            (async () => {
                const b = await entry.async("blob");
                div.innerHTML = `<img src="${URL.createObjectURL(b)}"><div class="thumb-page" style="font-size:10px">${index + 1}</div>`;
            })();
        });
        if (hasOpenedViewer) markCurrentThumbnail(false);
    }

    function markCurrentThumbnail(scroll) {
        thumbGrid.querySelectorAll('.thumb-container.current').forEach((el) => el.classList.remove('current'));
        const el = thumbGrid.querySelector(`.thumb-container[data-index="${currentIndex}"]`);
        if (!el) return;
        el.classList.add('current');
        if (scroll) {
            requestAnimationFrame(() => el.scrollIntoView({ block: 'center', inline: 'nearest', behavior: 'smooth' }));
        }
    }

    function updateResumeButton() {
        if (hasOpenedViewer && zipEntries.length) {
            resumeBtn.textContent = `続きから ${currentIndex + 1}`;
            resumeBtn.style.display = 'inline-block';
        } else {
            resumeBtn.style.display = 'none';
        }
    }

    resumeBtn.onclick = () => {
        if (!hasOpenedViewer || !zipEntries.length) return;
        openViewer();
    };

    function openViewer() {
        hideLocalShelf();
        if (zipEntries.length) thumbGrid.style.display = "grid";
        hasOpenedViewer = true;
        updateResumeButton();
        overlay.style.display = 'flex';
        overlay.focus();
        updatePreview();
        showUI();
        requestWakeLock();
    }

    async function getImageUrl(index) {
        if (index < 0 || index >= zipEntries.length) return null;
        if (blobCache.has(index)) return blobCache.get(index);
        const blob = await zipEntries[index].async("blob");
        const url = URL.createObjectURL(blob);
        blobCache.set(index, url);
        return url;
    }

    async function updatePreview() {
        resetZoom();
        const url1 = await getImageUrl(currentIndex);
        const imgL = document.getElementById('img-left'), imgR = document.getElementById('img-right');
        imgL.style.display = 'none'; imgR.style.display = 'none';
        if (state.viewMode === 'single') {
            imgL.src = url1; imgL.style.display = 'block';
        } else {
            const url2 = await getImageUrl(currentIndex + 1);
            imgL.style.display = 'block'; imgR.style.display = url2 ? 'block' : 'none';
            if (state.direction === 'rtl') {
                imgR.src = url1; if(url2) imgL.src = url2;
            } else {
                imgL.src = url1; if(url2) imgR.src = url2;
            }
        }
        document.getElementById('page-count').textContent = `${currentIndex + 1} / ${zipEntries.length}`;
        seekbar.value = currentIndex;
        localStorage.setItem('last-page-' + currentFileUrl, currentIndex);
    }

    function handleInteraction(x, y) {
        if (!controlsPanel.classList.contains('hide')) {
            if (!isUITargetElement(document.elementFromPoint(x, y))) { hideUI(); }
            return;
        }
        const w = window.innerWidth, h = window.innerHeight;
        if (x > w * 0.3 && x < w * 0.7 && y > h * 0.3 && y < h * 0.7) { showUI(); return; }
        nextPrev(y > h * 0.5 ? 1 : -1);
    }

    async function nextPrev(n) {
        if (scale > 1 || volumeLoading) return;
        const step = (state.viewMode === 'double' ? 2 : 1);
        const nextIndex = currentIndex + (n * step);
        if (nextIndex < 0) {
            if (await loadVolume(-1, 'last')) return;
            currentIndex = 0;
        } else if (nextIndex > zipEntries.length - 1) {
            if (await loadVolume(1, 'first')) return;
            currentIndex = zipEntries.length - 1;
        } else {
            currentIndex = nextIndex;
        }
        updatePreview();
    }

    btnPrevVol.onclick = (e) => { e.stopPropagation(); loadVolume(-1, 'last'); };
    btnNextVol.onclick = (e) => { e.stopPropagation(); loadVolume(1, 'first'); };

    btnDirection.onclick = (e) => {
        e.stopPropagation();
        state.direction = (state.direction === 'rtl') ? 'ltr' : 'rtl';
        persistDirection();
        applySettingStyles(); updatePreview(); resetIdleTimer();
    };

    btnViewMode.onclick = (e) => {
        e.stopPropagation();
        state.viewMode = (state.viewMode === 'single') ? 'double' : 'single';
        viewModeManualOverride = true;
        applySettingStyles(); updatePreview(); resetIdleTimer();
    };

    function resetZoom() { scale = 1; posX = 0; posY = 0; applyTransform(); }
    function applyTransform() { imageArea.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`; }
    function isUITargetElement(el) { return el && (el.closest('#controls-panel') || el.closest('#close-btn') || el.closest('#fullscreen-btn')); }
    function showUI() { document.querySelectorAll('#controls-panel, #close-btn, #fullscreen-btn').forEach(el => el.classList.remove('hide')); resetIdleTimer(); }
    function hideUI() { clearTimeout(idleTimer); document.querySelectorAll('#controls-panel, #close-btn, #fullscreen-btn').forEach(el => el.classList.add('hide')); }
    function resetIdleTimer() { clearTimeout(idleTimer); if (overlay.style.display === 'flex') idleTimer = setTimeout(hideUI, 5000); }

    overlay.addEventListener('touchstart', (e) => {
        if (isUITargetElement(e.target)) return;
        const t = e.touches[0]; touchStartTime = Date.now(); startPoint = { x: t.pageX, y: t.pageY };
        if (e.touches.length === 2) {
            isDoublePinch = true;
            initialPinchDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
        } else {
            isDoublePinch = false; isDragging = true; startX = t.pageX - posX; startY = t.pageY - posY;
        }
        resetIdleTimer();
    }, { passive: false });

    overlay.addEventListener('touchmove', (e) => {
        if (isUITargetElement(e.target)) return;
        if (e.touches.length === 2) {
            e.preventDefault();
            const d = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            scale = Math.min(Math.max(1, scale * (d / initialPinchDistance)), 5); initialPinchDistance = d; applyTransform();
        } else if (isDragging && scale > 1) {
            e.preventDefault(); const t = e.touches[0]; posX = t.pageX - startX; posY = t.pageY - startY; applyTransform();
        }
    }, { passive: false });

    overlay.addEventListener('touchend', (e) => {
        if (isUITargetElement(e.target)) { isDragging = false; return; }
        const d = Date.now() - touchStartTime; const t = e.changedTouches[0];
        const mx = t.pageX - startPoint.x; const my = t.pageY - startPoint.y;
        if (Math.hypot(mx, my) < 15 && d < 300) { e.preventDefault(); handleInteraction(t.pageX, t.pageY); }
        else if (scale === 1 && Math.abs(mx) > 50 && !isDoublePinch) {
            const flickDir = mx > 0 ? -1 : 1;
            nextPrev(state.direction === 'rtl' ? -flickDir : flickDir);
        }
        isDragging = false; isDoublePinch = false;
    });

    overlay.addEventListener('mousedown', (e) => {
        if (isUITargetElement(e.target)) return;
        isDragging = true; startX = e.pageX - posX; startY = e.pageY - posY; touchStartTime = Date.now(); startPoint = { x: e.pageX, y: e.pageY };
    });

    window.addEventListener('mouseup', (e) => {
        if (!isDragging || isUITargetElement(e.target)) return;
        const d = Date.now() - touchStartTime; const mx = e.pageX - startPoint.x; const my = e.pageY - startPoint.y;
        if (Math.hypot(mx, my) < 10 && d < 300) { handleInteraction(e.pageX, e.pageY); }
        else if (scale === 1 && Math.abs(mx) > 50) {
            const flickDir = mx > 0 ? -1 : 1;
            nextPrev(state.direction === 'rtl' ? -flickDir : flickDir);
        }
        isDragging = false;
    });

    window.addEventListener('keydown', (e) => {
        if (overlay.style.display === 'flex') {
            if (e.key === "ArrowLeft") { e.preventDefault(); nextPrev(state.direction === 'rtl' ? 1 : -1); }
            if (e.key === "ArrowRight") { e.preventDefault(); nextPrev(state.direction === 'rtl' ? -1 : 1); }
            if (e.key === "Escape") document.getElementById('close-btn').click();
        }
    });

    document.getElementById('fullscreen-btn').onclick = () => {
        const el = overlay;
        if (el.requestFullscreen) { if (!document.fullscreenElement) el.requestFullscreen(); else document.exitFullscreen(); }
        else if (el.webkitRequestFullscreen) { if (!document.webkitFullscreenElement) el.webkitRequestFullscreen(); else document.webkitExitFullscreen(); }
    };
    document.getElementById('close-btn').onclick = (e) => {
        e.stopPropagation(); if(document.fullscreenElement || document.webkitFullscreenElement) {
            if(document.exitFullscreen) document.exitFullscreen(); else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
        }
        overlay.style.display = 'none'; resetZoom(); releaseWakeLock();
        updateResumeButton();
        markCurrentThumbnail(true);
    };
    seekbar.oninput = () => { currentIndex = parseInt(seekbar.value); updatePreview(); resetIdleTimer(); };
</script>
</body>
</html>
